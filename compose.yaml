services:
  mongo:
    image: mongo:7
    profiles: ["migration"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: interviewmaster
      POSTGRES_PASSWORD: local_development_only
      POSTGRES_DB: interviewmaster
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  postgres_data:
  redis_data:
